# =============================================================================
# AI Datacenter — Umbrella Chart Values
# =============================================================================
# This file configures four subcharts:
#   1. vllm-stack   — GPU inference serving (vLLM Production Stack)
#   2. litellm      — OpenAI-compatible API gateway
#   3. open-webui   — Chat portal for end users
#   4. postgresql   — Shared in-cluster database
#
# Node placement strategy:
#   - GPU workloads:  ai.bekk.no/model=<model-name>  (one label per model)
#   - System pods:    ai.bekk.no/role=system
# =============================================================================

# -----------------------------------------------------------------------------
# 1. vLLM Production Stack
# -----------------------------------------------------------------------------
# The stack deploys a router + one serving engine per model.  The router
# exposes a single /v1 endpoint that auto-dispatches by model name.
vllm-stack:
  enabled: true

  servingEngineSpec:
    runtimeClassName: "nvidia"
    tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "cloud.google.com/gke-spot"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"

    modelSpec:
      # -- Gemma 4 27B (Instruction-Tuned) ----------------------------------
      - name: "gemma-4"
        enabled: true
        repository: "vllm/vllm-openai"
        tag: "latest"
        modelURL: "google/gemma-4-27b-it"
        replicaCount: 1
        requestCPU: 4
        requestMemory: "16Gi"
        requestGPU: 1
        pvcStorage: "50Gi"
        nodeSelector:
          ai.bekk.no/model: "gemma-4"
        vllmConfig:
          dtype: "auto"
          maxModelLen: 8192
          extraArgs: ["--gpu-memory-utilization", "0.9"]

      # -- Future models (uncomment and adjust to enable) --------------------
      # - name: "llama-4-scout"
      #   enabled: false
      #   repository: "vllm/vllm-openai"
      #   tag: "latest"
      #   modelURL: "meta-llama/Llama-4-Scout-17B-16E-Instruct"
      #   replicaCount: 1
      #   requestCPU: 8
      #   requestMemory: "32Gi"
      #   requestGPU: 1
      #   pvcStorage: "80Gi"
      #   nodeSelector:
      #     ai.bekk.no/model: "llama-4-scout"
      #   vllmConfig:
      #     dtype: "auto"
      #     maxModelLen: 8192
      #     extraArgs: ["--gpu-memory-utilization", "0.9"]

      # - name: "deepseek-r1"
      #   enabled: false
      #   repository: "vllm/vllm-openai"
      #   tag: "latest"
      #   modelURL: "deepseek-ai/DeepSeek-R1"
      #   replicaCount: 1
      #   requestCPU: 8
      #   requestMemory: "64Gi"
      #   requestGPU: 4
      #   pvcStorage: "200Gi"
      #   nodeSelector:
      #     ai.bekk.no/model: "deepseek-r1"
      #   vllmConfig:
      #     dtype: "auto"
      #     maxModelLen: 4096
      #     extraArgs:
      #       - "--gpu-memory-utilization"
      #       - "0.95"
      #       - "--tensor-parallel-size"
      #       - "4"

  routerSpec:
    routingLogic: "roundrobin"
    replicaCount: 1

# -----------------------------------------------------------------------------
# 2. LiteLLM API Gateway
# -----------------------------------------------------------------------------
# Provides a unified OpenAI-compatible API in front of the vLLM router.
# Model routing config is injected via the litellm-config ConfigMap
# (see templates/litellm-config.yaml).
litellm:
  enabled: true
  nodeSelector:
    ai.bekk.no/role: "system"

# -----------------------------------------------------------------------------
# 3. Open WebUI — Chat Portal
# -----------------------------------------------------------------------------
# Web-based chat UI.  Uses LiteLLM as the OpenAI-compatible backend.
# Ollama is disabled — all inference goes through LiteLLM → vLLM.
open-webui:
  enabled: true
  nodeSelector:
    ai.bekk.no/role: "system"
  # Ollama is disabled — we use LiteLLM as the OpenAI-compatible backend

# -----------------------------------------------------------------------------
# 4. PostgreSQL — Shared In-Cluster Database
# -----------------------------------------------------------------------------
# A single Bitnami PostgreSQL instance shared by LiteLLM and Open WebUI.
# Disable this and enable externalDatabase to use a managed database instead.
postgresql:
  enabled: true
  primary:
    nodeSelector:
      ai.bekk.no/role: "system"
    initdb:
      scripts:
        # Create the two application databases on first boot.
        init-databases.sql: |
          CREATE DATABASE litellm;
          CREATE DATABASE openwebui;

# -----------------------------------------------------------------------------
# 5. External Database (alternative to in-cluster PostgreSQL)
# -----------------------------------------------------------------------------
# Enable this when using a managed PostgreSQL (e.g. Cloud SQL, RDS).
# The referenced Secret must contain two keys with full connection URLs:
#   litellmKey:    postgresql://user:pass@host:5432/litellm?sslmode=require
#   openWebuiKey:  postgresql://user:pass@host:5432/openwebui?sslmode=require
externalDatabase:
  enabled: false
  existingSecret: "ai-datacenter-db-credentials"
  litellmKey: "litellm-database-url"
  openWebuiKey: "open-webui-database-url"
