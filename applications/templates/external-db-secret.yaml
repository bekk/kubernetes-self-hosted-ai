{{/*
  Database configuration validation.
  Ensures that exactly one of postgresql (in-cluster) or externalDatabase
  is enabled — never both, and warns if neither.
*/}}

{{- if and .Values.postgresql.enabled .Values.externalDatabase.enabled }}
{{- fail "Cannot enable both postgresql and externalDatabase. Set one to false." }}
{{- end }}

{{- if and (not .Values.postgresql.enabled) (not .Values.externalDatabase.enabled) }}
{{- fail "No database configured. Enable either postgresql (in-cluster) or externalDatabase." }}
{{- end }}
