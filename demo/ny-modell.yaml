# ──────────────────────────────────────────────────────────────────────────────
# Demo: «et annet team» deployer en modell forbi plattformen
# ──────────────────────────────────────────────────────────────────────────────
# Ber om 4 TPU-er, men nodeSelector peker på en node pool som ikke finnes,
# fordi modellen aldri ble lagt inn i models.yaml. (Toleration trengs ikke:
# GKE legger den til automatisk på poder som ber om google.com/tpu.)
# Poden blir derfor stående i Pending, og autoscaleren har ingen pool å skalere.
#
# Koster ingenting: ingen node kan matche, og imaget er bare en pause-container.
#   make demo-break   # deploy
#   make demo-fix     # rydd opp
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ny-modell
  namespace: ai-datacenter
  labels:
    app.kubernetes.io/name: ny-modell
    team: team-innsikt
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ny-modell
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ny-modell
        team: team-innsikt
    spec:
      nodeSelector:
        ai.bekk.no/model: ny-modell
      containers:
        - name: vllm
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              google.com/tpu: 4
              memory: 8Gi
