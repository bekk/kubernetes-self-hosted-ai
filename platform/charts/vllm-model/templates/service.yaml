apiVersion: v1
kind: Service
metadata:
  name: {{ include "vllm-model.name" . }}
  labels:
    {{- include "vllm-model.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "vllm-model.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
