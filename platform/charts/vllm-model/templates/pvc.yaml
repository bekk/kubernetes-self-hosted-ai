apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "vllm-model.name" . }}-cache
  labels:
    {{- include "vllm-model.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.cache.storageClass }}
  resources:
    requests:
      storage: {{ .Values.cache.size }}
